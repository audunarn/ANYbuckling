[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYbuckling"
version = "0.1.0"
description = "Buckling of stiffened flat panels, cylinders and curved plates according to DNV standards - prescriptive (DNV-RP-C201/C202) and semi-analytical (S3/U3) methods"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["buckling", "DNV", "RP-C201", "RP-C202", "stiffened panel", "cylinder", "offshore", "structural engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
excel = ["xlwings"]
dev = ["pytest", "build"]

[project.urls]
Homepage = "https://github.com/audunarn/ANYbuckling"
Repository = "https://github.com/audunarn/ANYbuckling"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anybuckling = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
